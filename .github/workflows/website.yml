# Builds docs/website/ with Zensical and publishes it to GitHub Pages.
# Requires Settings > Pages > Source: "GitHub Actions".
# See docs/context/decisions/0016-project-website.md.
name: website

on:
  push:
    branches: [main]
    paths:
      - "docs/website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "docs/website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Zensical's docs advise against caching on CI, so --clean and no cache.
      - run: >-
          uv run --no-project --with-requirements docs/website/requirements.txt
          zensical build --strict --clean -f docs/website/mkdocs.yml
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
